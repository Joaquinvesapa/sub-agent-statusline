allowBuilds:
  protobufjs: true
# pnpm settings (pnpm >= 10 reads configuration from this file).
#
# protobufjs is a transitive dependency (pulled in by @opencode/plugin) whose
# postinstall script bundles its optional runtime; pnpm ignores build scripts
# by default in v11, which makes the verify-deps-before-run check fail.
onlyBuiltDependencies:
  - protobufjs
